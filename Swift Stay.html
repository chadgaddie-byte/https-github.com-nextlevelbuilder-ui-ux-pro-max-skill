<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Swift Stay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #EEF4FB;
    -webkit-font-smoothing: antialiased;
    color: #0F1B2D;
    position: relative;
    overflow-x: hidden;
  }
  /* Ambient blue backdrop with drifting blurred orbs for liquid-glass context */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 620px; height: 620px;
    background: radial-gradient(circle, #6FA4E8 0%, transparent 70%);
    top: -180px; left: -120px;
  }
  body::after {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #8FC8E8 0%, transparent 70%);
    bottom: -140px; right: -80px;
  }
  input:focus { border-color: #2F6BE0 !important; box-shadow: 0 0 0 3px rgba(47,107,224,0.14); }
  button:hover { opacity: 0.94; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(47,107,224,0.25); border-radius: 3px; }
  @media (max-width: 768px) {
    aside.sidebar-root { display: none !important; }
    main.main-root { margin-left: 0 !important; padding: 20px 16px 80px !important; }
    .two-col { grid-template-columns: 1fr !important; }
    .login-root { flex-direction: column !important; }
    .login-right { width: 100% !important; }
    .landing-hero-inner { flex-direction: column !important; text-align: center; }
    .landing-hero-ctas { justify-content: center !important; }
    .landing-feat-grid { grid-template-columns: 1fr !important; }
    .landing-steps { grid-template-columns: 1fr !important; }
    .landing-step-connector { display: none !important; }
    .landing-prop-grid { flex-direction: column !important; }
    .landing-testimonials { grid-template-columns: 1fr !important; }
    .landing-nav-links { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState } = React;

// Blue palette
const C = {
  primary: '#2F6BE0',       // main blue (replaces orange)
  primaryDark: '#1E4FB8',
  primarySoft: '#6FA4E8',   // lighter highlight (replaces F4A574)
  primaryBg: '#EBF2FF',     // soft blue bg (replaces FFF5EE)
  primaryBg2: '#F5F9FF',
  ink: '#0F1B2D',           // near-navy (replaces 1A1D21)
  ink2: '#2A3A55',
  ink3: '#5A6A85',          // muted (replaces 7C818A)
  line: '#E4ECF7',          // subtle line (replaces F0F1F3)
  line2: '#CAD7EA',
  panel: '#F5F7FB',         // surface (replaces F5F5F2)
  glassBg: 'rgba(255,255,255,0.65)',
  glassBgDark: 'rgba(16,30,55,0.55)',
  glassBorder: 'rgba(255,255,255,0.5)',
  glassBorderDark: 'rgba(255,255,255,0.1)',
  green: '#1F9D6A', greenBg: '#E3F6EC',
  red: '#C8364B', redBg: '#FBEAEE',
  blue: '#2F6BE0', blueBg: '#EBF2FF',
};

// Icons
const I = {
  Home: (p) => <svg width={p?.s||20} height={p?.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
  Search: (p) => <svg width={p?.s||20} height={p?.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  Doc: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
  User: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
  Arrow: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>,
  Back: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
  Zap: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
  Shield: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
  Lock: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
  Wifi: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>,
  Car: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a1 1 0 0 0-.8.4L1.74 11 .84 11.86a1 1 0 0 0-.84.99V16h3"/><circle cx="6.5" cy="16.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></svg>,
  Drop: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>,
  Bed: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>,
  Bld: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="9" y1="6" x2="9" y2="6.01"/><line x1="15" y1="6" x2="15" y2="6.01"/><line x1="9" y1="10" x2="9" y2="10.01"/><line x1="15" y1="10" x2="15" y2="10.01"/><line x1="9" y1="14" x2="9" y2="14.01"/><line x1="15" y1="14" x2="15" y2="14.01"/><path d="M9 18h6v4H9z"/></svg>,
  Log: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
};

// Liquid glass helpers
const glass = {
  background: 'linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.55) 100%)',
  backdropFilter: 'blur(22px) saturate(160%)',
  WebkitBackdropFilter: 'blur(22px) saturate(160%)',
  border: `1px solid ${C.glassBorder}`,
  borderRadius: 16,
  boxShadow: '0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 30px -12px rgba(47,107,224,0.18), 0 2px 6px rgba(20,40,80,0.05)',
};
const glassDark = {
  background: `linear-gradient(180deg, #1E4FB8 0%, #163D90 60%, #0F2E6E 100%)`,
  border: `1px solid rgba(255,255,255,0.1)`,
  boxShadow: '0 1px 0 rgba(255,255,255,0.12) inset, 0 20px 40px -20px rgba(15,46,110,0.55)',
};

const Logo = ({ white }) => (
  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
    <div style={{
      width: 36, height: 36,
      background: white
        ? 'linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.08))'
        : `linear-gradient(135deg, ${C.primary}, ${C.primaryDark})`,
      borderRadius: 10,
      display: "flex", alignItems: "center", justifyContent: "center",
      boxShadow: white ? 'inset 0 1px 0 rgba(255,255,255,0.3)' : '0 6px 16px -4px rgba(47,107,224,0.5), inset 0 1px 0 rgba(255,255,255,0.25)',
      color: '#fff',
      border: white ? '1px solid rgba(255,255,255,0.2)' : 'none'
    }}>
      <I.Home s={18} />
    </div>
    <div>
      <div style={{ fontFamily: "Outfit", fontWeight: 700, fontSize: 18, color: white ? "#fff" : C.ink, lineHeight: 1 }}>
        Swift<span style={{ color: white ? C.primarySoft : C.primary }}>Stay</span>
      </div>
      <div style={{ fontSize: 9, color: white ? "rgba(255,255,255,0.6)" : C.ink3, fontWeight: 500, letterSpacing: 1.5, textTransform: "uppercase" }}>rent easy</div>
    </div>
  </div>
);

const Pill = ({ children, c = "blue" }) => {
  const m = { blue: { bg: C.blueBg, c: C.primary }, green: { bg: C.greenBg, c: C.green }, red: { bg: C.redBg, c: C.red } };
  return <span style={{ display: "inline-block", padding: "4px 12px", borderRadius: 50, fontSize: 12, fontWeight: 600, background: m[c].bg, color: m[c].c, border: `1px solid ${m[c].c}22` }}>{children}</span>;
};

const Btn = ({ children, onClick, v = "primary", full, disabled }) => {
  const styles = {
    primary: {
      background: disabled ? '#B8C5D8' : `linear-gradient(180deg, ${C.primary}, ${C.primaryDark})`,
      color: "#fff",
      boxShadow: disabled ? 'none' : `0 8px 20px -6px ${C.primary}80, inset 0 1px 0 rgba(255,255,255,0.3)`,
    },
    outline: { background: "rgba(255,255,255,0.7)", color: C.primary, border: `1.5px solid ${C.primary}`, backdropFilter: 'blur(8px)' },
  };
  return (
    <button onClick={disabled ? undefined : onClick} style={{
      width: full ? "100%" : "auto", padding: "13px 28px", borderRadius: 12,
      fontSize: 15, fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer",
      fontFamily: "DM Sans", border: "none", transition: 'all 0.2s',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
      ...styles[v]
    }}>{children}</button>
  );
};

const Card = ({ children, style = {}, onClick, variant = 'glass' }) => {
  const base = variant === 'solid'
    ? { background: '#fff', borderRadius: 16, border: `1px solid ${C.line}`, boxShadow: '0 2px 12px rgba(20,40,80,0.04)' }
    : glass;
  return <div onClick={onClick} style={{ ...base, ...style }}>{children}</div>;
};

// Sidebar (desktop)
const Sidebar = ({ active, setScreen }) => (
  <aside className="sidebar-root" style={{
    width: 240, color: "#fff",
    display: "flex", flexDirection: "column",
    position: "fixed", top: 16, left: 16, bottom: 16, zIndex: 200,
    borderRadius: 20,
    ...glassDark,
    overflow: 'hidden'
  }}>
    <div style={{ padding: "24px 20px", borderBottom: "1px solid rgba(255,255,255,0.08)" }}>
      <Logo white />
    </div>
    <nav style={{ flex: 1, padding: "16px 12px", display: "flex", flexDirection: "column", gap: 4 }}>
      {[
        { id: "home", icon: <I.Home />, label: "Home" },
        { id: "search", icon: <I.Search />, label: "Find a Space" },
        { id: "statement", icon: <I.Doc />, label: "Statement" },
        { id: "profile", icon: <I.User />, label: "Profile" },
      ].map(item => (
        <button key={item.id} onClick={() => setScreen(item.id)} style={{
          display: "flex", alignItems: "center", gap: 12, padding: "12px 14px",
          borderRadius: 10, border: "none", cursor: "pointer", fontFamily: "DM Sans",
          fontSize: 14, fontWeight: active === item.id ? 600 : 400, width: "100%", textAlign: "left",
          background: active === item.id
            ? 'rgba(255,255,255,0.18)'
            : "transparent",
          color: active === item.id ? '#fff' : "rgba(255,255,255,0.75)",
          transition: "all 0.2s",
          boxShadow: active === item.id ? 'inset 0 1px 0 rgba(255,255,255,0.2)' : 'none',
          border: active === item.id ? '1px solid rgba(255,255,255,0.22)' : '1px solid transparent'
        }}>{item.icon} {item.label}</button>
      ))}
    </nav>
    <div style={{ padding: "16px 12px", borderTop: "1px solid rgba(255,255,255,0.08)" }}>
      <button onClick={() => setScreen("login")} style={{
        display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 10,
        border: "none", cursor: "pointer", fontFamily: "DM Sans", fontSize: 14, width: "100%",
        background: "transparent", color: "rgba(255,255,255,0.65)", textAlign: "left"
      }}><I.Log /> Log Out</button>
    </div>
  </aside>
);

const TopBar = ({ title, sub, onBack, setScreen }) => (
  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 32, gap: 20 }}>
    <div style={{ display: "flex", alignItems: "center", gap: 14, minWidth: 0, flex: 1 }}>
      {onBack && <button onClick={onBack} style={{
        width: 38, height: 38, borderRadius: 10, border: `1px solid ${C.line2}`,
        background: 'rgba(255,255,255,0.7)', backdropFilter: 'blur(12px)',
        cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
        color: C.ink, flexShrink: 0
      }}><I.Back /></button>}
      <div style={{ minWidth: 0 }}>
        <h1 style={{ fontFamily: "Outfit", fontSize: 26, fontWeight: 800, color: C.ink, letterSpacing: '-0.01em' }}>{title}</h1>
        {sub && <p style={{ fontSize: 14, color: C.ink3, marginTop: 2 }}>{sub}</p>}
      </div>
    </div>
    <div onClick={() => setScreen("profile")} style={{
      width: 42, height: 42, borderRadius: 12,
      background: `linear-gradient(135deg, ${C.primary}, ${C.primaryDark})`,
      display: "flex", alignItems: "center", justifyContent: "center",
      color: "#fff", fontFamily: "Outfit", fontWeight: 700, fontSize: 14,
      cursor: "pointer", flexShrink: 0,
      boxShadow: '0 6px 16px -4px rgba(47,107,224,0.5), inset 0 1px 0 rgba(255,255,255,0.3)'
    }}>CG</div>
  </div>
);

// ─── Screens ───

const LandingScreen = ({ setScreen }) => {
  const feat = [
    { icon: <I.Zap />, title: "Instant Booking", body: "Pick a move-in date and secure your apartment the same day — no waiting, no paperwork queues." },
    { icon: <I.Shield />, title: "No Lease Required", body: "Month-to-month stays with full flexibility. Stay as long as you need, leave when you're ready." },
    { icon: <I.Lock />, title: "Secure & Verified", body: "Every tenant is ID-verified. Every building is 24/7 secured. Your safety is our baseline." },
    { icon: <I.Wifi />, title: "Fully Furnished", body: "WiFi, water, parking, and a modern kitchen — all included in your monthly rate." },
    { icon: <I.Bed />, title: "1–3 BR Options", body: "Solo or shared living, we have sizes to fit your budget and your team." },
    { icon: <I.Car />, title: "Same-Day Move In", body: "Complete your booking online, collect your keys, and be home before sunset." },
  ];
  const steps = [
    { n: "01", t: "Pick a date", d: "Choose when you want to move in — even today. We'll show you what's available." },
    { n: "02", t: "Choose your space", d: "Browse 1, 2, and 3-bedroom apartments at York House, Johannesburg." },
    { n: "03", t: "Pay & move in", d: "Secure online payment, instant confirmation, same-day key collection." },
  ];
  const testimonials = [
    { q: "I booked on a Wednesday and moved in that Friday. No agent fees, no lease — it was actually that easy.", name: "Amara S.", role: "Designer, JHB" },
    { q: "Perfect for when I relocated for work. The process was completely online and I had my keys within 24 hours.", name: "Thabo M.", role: "Engineer, relocated from CPT" },
    { q: "Honestly the cleanest rental experience I've ever had. The building is great and the app is super simple.", name: "Priya K.", role: "Freelancer, JHB" },
  ];
  return (
    <div style={{ minHeight: "100vh", position: 'relative', zIndex: 1, overflowX: 'hidden' }}>

      {/* ── NAV ── */}
      <nav style={{
        position: 'sticky', top: 0, zIndex: 100,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 48px', height: 68,
        background: 'rgba(238,244,251,0.8)',
        backdropFilter: 'blur(20px)',
        WebkitBackdropFilter: 'blur(20px)',
        borderBottom: `1px solid ${C.line}`,
      }}>
        <Logo />
        <div className="landing-nav-links" style={{ display: 'flex', alignItems: 'center', gap: 32 }}>
          {['Features', 'How it works', 'Our building', 'Pricing'].map(l => (
            <span key={l} style={{ fontSize: 14, fontWeight: 500, color: C.ink2, cursor: 'pointer' }}>{l}</span>
          ))}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <button onClick={() => setScreen("login")} style={{ padding: '10px 22px', borderRadius: 10, border: `1.5px solid ${C.line2}`, background: 'rgba(255,255,255,0.7)', backdropFilter: 'blur(8px)', fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'DM Sans', color: C.ink }}>Log In</button>
          <Btn onClick={() => setScreen("signup")}>Get Started</Btn>
        </div>
      </nav>

      {/* ── HERO ── */}
      <div style={{
        background: `linear-gradient(160deg, #0A1628 0%, #1E3A6B 50%, #2F6BE0 100%)`,
        padding: '90px 48px 100px', position: 'relative', overflow: 'hidden',
      }}>
        <div style={{ position: 'absolute', top: '-10%', left: '-5%', width: 600, height: 600, borderRadius: '50%', background: 'radial-gradient(circle, rgba(111,164,232,0.3), transparent 70%)', filter: 'blur(40px)', pointerEvents: 'none' }} />
        <div style={{ position: 'absolute', bottom: '-15%', right: '-5%', width: 480, height: 480, borderRadius: '50%', background: 'radial-gradient(circle, rgba(143,200,232,0.22), transparent 70%)', filter: 'blur(40px)', pointerEvents: 'none' }} />
        <div className="landing-hero-inner" style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', gap: 64, position: 'relative', zIndex: 1 }}>
          <div style={{ flex: 1 }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '6px 14px', borderRadius: 99, background: 'rgba(111,164,232,0.2)', border: '1px solid rgba(111,164,232,0.35)', marginBottom: 28 }}>
              <span style={{ width: 7, height: 7, borderRadius: '50%', background: C.primarySoft, boxShadow: `0 0 8px ${C.primarySoft}` }} />
              <span style={{ fontSize: 12, fontWeight: 600, color: C.primarySoft, letterSpacing: 0.5 }}>Now available in Johannesburg</span>
            </div>
            <h1 style={{ fontFamily: 'Outfit', fontSize: 'clamp(38px, 5vw, 68px)', fontWeight: 800, color: '#fff', lineHeight: 1.05, letterSpacing: '-0.03em', marginBottom: 24 }}>
              Rent a space.<br />
              <span style={{ color: C.primarySoft }}>Move in today.</span>
            </h1>
            <p style={{ fontSize: 18, color: 'rgba(255,255,255,0.7)', lineHeight: 1.7, marginBottom: 36, maxWidth: 520 }}>
              Swift Stay makes renting as simple as booking a hotel room. No lease, no agent fees, no waiting. Pick a date — we'll handle the rest.
            </p>
            <div className="landing-hero-ctas" style={{ display: 'flex', gap: 14, alignItems: 'center' }}>
              <Btn onClick={() => setScreen("signup")}>Get Started Free <I.Arrow /></Btn>
              <button onClick={() => setScreen("login")} style={{ padding: '13px 24px', borderRadius: 12, border: '1.5px solid rgba(255,255,255,0.3)', background: 'rgba(255,255,255,0.1)', backdropFilter: 'blur(12px)', color: '#fff', fontSize: 15, fontWeight: 600, cursor: 'pointer', fontFamily: 'DM Sans' }}>Log In</button>
            </div>
            <div style={{ display: 'flex', gap: 36, marginTop: 48, paddingTop: 36, borderTop: '1px solid rgba(255,255,255,0.1)' }}>
              {[{ n: "100+", l: "Happy tenants" }, { n: "Same day", l: "Move-in available" }, { n: "No", l: "Lease required" }, { n: "24/7", l: "Building security" }].map((s, i) => (
                <div key={i}>
                  <div style={{ fontFamily: 'Outfit', fontSize: 22, fontWeight: 700, color: C.primarySoft }}>{s.n}</div>
                  <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.5)', marginTop: 3 }}>{s.l}</div>
                </div>
              ))}
            </div>
          </div>

const TWEAKS = /*EDITMODE-BEGIN*/{
  "accentHue": 218,

}/*EDITMODE-END*/;

const App = () => {
  const [screen, setScreen] = useState(() => localStorage.getItem('ss_screen') || "landing");
  const [tweaksOpen, setTweaksOpen] = useState(false);

  React.useEffect(() => { localStorage.setItem('ss_screen', screen); }, [screen]);

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const screens = {
    landing: <LandingScreen setScreen={setScreen} />,
    login: <LoginScreen setScreen={setScreen} />,
    home: <HomeScreen setScreen={setScreen} />,
    search: <SearchScreen setScreen={setScreen} />,
    building: <BuildingScreen setScreen={setScreen} />,
    units: <UnitsScreen setScreen={setScreen} />,
    details: <DetailsScreen setScreen={setScreen} />,
    confirm: <ConfirmScreen setScreen={setScreen} />,
    payment: <PaymentScreen setScreen={setScreen} />,
    statement: <StatementScreen setScreen={setScreen} />,
    profile: <ProfileScreen setScreen={setScreen} />,
  };

  return (
    <div data-screen-label={`${screen}`}>
      {screens[screen] || screens.home}
      {tweaksOpen && (
        <div style={{
          position: 'fixed', bottom: 20, right: 20, width: 260, padding: 16,
          borderRadius: 14, zIndex: 500, ...glass, color: C.ink
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <b style={{ fontFamily: 'Outfit', fontSize: 15 }}>Tweaks</b>
            <button onClick={() => setTweaksOpen(false)} style={{ background: 'none', border: 'none', fontSize: 18, cursor: 'pointer', color: C.ink3 }}>×</button>
          </div>
          <div style={{ fontSize: 11, color: C.ink3, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 8 }}>Jump to screen</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {Object.keys(screens).map(s => (
              <button key={s} onClick={() => setScreen(s)} style={{
                padding: '5px 10px', borderRadius: 7, fontSize: 11,
                background: screen === s ? C.primary : 'rgba(255,255,255,0.6)',
                color: screen === s ? '#fff' : C.ink2,
                border: `1px solid ${screen === s ? C.primary : C.line2}`,
                cursor: 'pointer', fontFamily: 'DM Sans', fontWeight: 500
              }}>{s}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
